name: stage-captions
services:
  stage:
    build:
      context: ..
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:${STAGE_PORT:-4310}:4310"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4310
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the public HTTPS origin}
      TEAM_ACCESS_CODE: ${TEAM_ACCESS_CODE:?Set a strong shared team code}
      SONIOX_API_KEY: ${SONIOX_API_KEY:-}
      SONIOX_REGION: ${SONIOX_REGION:-global}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      TEAM_TOKEN_LIMIT_PER_MINUTE: ${TEAM_TOKEN_LIMIT_PER_MINUTE:-60}
      DATABASE_PATH: /app/data/stage.db
    volumes:
      - stage-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/api/session').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
volumes:
  stage-data:
